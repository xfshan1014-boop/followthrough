<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com https://api.deepseek.com https://openrouter.ai https://api.groq.com https://api.together.xyz https://api.mistral.ai http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">

<title>Followthrough</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">

body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}

/* Platform layer (web + Mac app): onboarding card, settings, AI setup, import, setup card, recording. */
.tb-extra{display:flex;gap:6px;align-items:center;flex:none}
.tb-btn{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:8px;padding:5px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.tb-btn:hover{border-color:var(--border-strong);color:var(--ink)}
.tb-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.tb-btn .dot.on{background:var(--ok)}
.tb-btn.icon{width:30px;justify-content:center;padding:5px 0;font-size:14px}
.ob-scrim{position:fixed;inset:0;background:rgba(20,18,15,.38);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;overscroll-behavior:contain;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
/* margin:auto centers the card in the scrim; a card taller than the window scrolls instead of being clipped */
.ob-card{width:min(640px,100%);margin:auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 24px 60px rgba(20,18,15,.22);padding:32px 34px 28px}
.ob-card.wide{width:min(680px,100%)}
.ob-bars{display:flex;gap:6px;margin-bottom:22px}
.ob-bars i{height:4px;flex:1;border-radius:2px;background:var(--surface-2)}
.ob-bars i.on{background:var(--ink)}
.ob-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ob-eb{font-size:11.5px;font-weight:500;color:var(--ink-3);letter-spacing:.03em}
.ob-x{margin-left:auto;border:0;background:none;color:var(--ink-3);font-size:20px;line-height:1;padding:2px 4px}
.ob-x:hover{color:var(--ink)}
.ob-card h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.2;letter-spacing:-.01em;margin:6px 0 10px}
.ob-card p{margin:0 0 14px;color:var(--ink-2);font-size:14.5px}
.ob-acts{display:flex;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap}
.ob-skip{border:0;background:none;color:var(--ink-3);font-size:13px;padding:0}
.ob-skip:hover{color:var(--ink)}
.ob-lnk{border:0;background:none;padding:0;color:var(--accent);font-size:13px;font-weight:500;text-decoration:none}
.ob-lnk:hover{text-decoration:underline}
.ob-label{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin:12px 0 5px}
.ob-req{color:var(--danger);margin-left:2px}
.ob-err{font-size:12px;color:var(--danger);margin-top:5px}
.inp.bad{border-color:var(--danger)}
.ob-hint{font-size:12px;color:var(--ink-3);margin-top:6px}
.ob-langs{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;margin-left:auto}
.ob-langs button{border:0;background:none;border-radius:7px;padding:3px 10px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.ob-langs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ob-pills{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.ob-pill{font-size:13px;border:1px solid var(--border);border-radius:999px;padding:3px 10px;color:var(--ink-2);background:var(--surface);white-space:nowrap}
.ob-even{display:grid!important}
.ob-even>*{text-align:center}
.ob-oss{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--ink-2)}
.ob-oss b{color:var(--ink);font-weight:500}
.ob-flow{display:grid;gap:8px;margin:6px 0 4px}
.ob-fl{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:11px;padding:10px 12px}
.ob-fl .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.ob-fl .h{font-size:13px;font-weight:500}
.ob-fl .d{font-size:12.5px;color:var(--ink-2)}
.ob-tabs{display:flex;gap:2px;background:var(--surface-2);border-radius:9px;padding:3px;margin:4px 0 10px}
.ob-tabs button{flex:1;border:0;background:none;border-radius:7px;padding:5px 6px;font-size:12px;font-weight:500;color:var(--ink-2)}
.ob-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ob-demo{border:1px solid var(--border);border-radius:11px;padding:12px;background:var(--bg);min-height:132px}
.ob-demo .ln{font-size:12.5px;padding:3px 0}
.ob-demo .sp{font-weight:600;font-size:11.5px;margin-right:4px}
.ob-demo mark{background:var(--ok-soft);color:inherit;border-radius:3px;padding:0 2px}
.ob-demo .row{display:flex;gap:8px;align-items:center;font-size:12.5px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;margin-bottom:5px;background:var(--surface)}
.ob-demo .row .ic{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:600;flex:none}
.ob-demo .bub{font-size:12.5px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 9px;margin-bottom:6px}
.ob-demo .cap{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.ob-live{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--danger);font-weight:500;margin-bottom:6px}
.ob-live i{width:6px;height:6px;border-radius:50%;background:var(--danger)}
.ob-provs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:4px 0 10px}
.ob-prov{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:7px 8px;font-size:12.5px;font-weight:500;text-align:left}
.ob-prov small{display:block;font-weight:400;color:var(--ink-3);font-size:11px}
.ob-prov.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ob-card details{border:1px solid var(--border);border-radius:10px;margin-top:10px}
.ob-card summary{cursor:pointer;padding:9px 12px;font-size:13px;font-weight:500;list-style:none;display:flex;align-items:center;gap:8px}
.ob-card summary::-webkit-details-marker{display:none}
.ob-card summary::after{content:"+";margin-left:auto;color:var(--ink-3);font-size:15px}
.ob-card details[open] summary::after{content:"–"}
.ob-card details ol{margin:0;padding:0 14px 12px 32px;font-size:12.5px;color:var(--ink-2)}
.ob-card details li{margin:4px 0}
.ob-card code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.ob-keyrow{display:flex;gap:8px;margin-top:10px}
.ob-keyrow .inp{font-family:var(--mono);font-size:12.5px}
.ob-ok{font-size:12px;color:var(--ok);margin-top:6px}
.ob-two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.ob-perks{display:grid;gap:8px;margin:8px 0 6px}
.ob-perk{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.ob-perk .ic{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;flex:none;font-size:13px}
.ob-perk .h{font-weight:500}
.ob-perk .d{font-size:12.5px;color:var(--ink-2)}
.ob-dl{display:flex;gap:12px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:12px}
.ob-appicon{width:44px;height:44px;flex:none}.ob-appicon svg{width:44px;height:44px;display:block}
.ob-set{border-top:1px solid var(--border);padding:14px 0}
.ob-set:first-of-type{border-top:0;padding-top:4px}
.ob-set h3{font-size:13px;font-weight:600;margin:0 0 8px}
.ob-setrow{display:flex;align-items:center;gap:8px;font-size:13px;padding:2px 0;flex-wrap:wrap}
.ob-setrow .l{flex:1;min-width:140px;color:var(--ink-2)}
.ob-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ob-chip{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;border:1px solid var(--border);border-radius:999px;padding:3px 6px 3px 10px;background:var(--surface-2)}
.ob-chip button{border:0;background:none;color:var(--ink-3);padding:0 2px}
.ob-drop{border:1.5px dashed var(--border-strong);border-radius:12px;padding:22px;text-align:center;display:grid;gap:8px;justify-items:center;margin:6px 0 4px;background:var(--bg)}
.ob-drop.over{border-color:var(--accent);background:var(--accent-soft)}
.ob-drop .big{font-size:22px;color:var(--ink-3)}
.ob-kinds{display:grid;gap:6px;margin-top:10px}
.ob-kind{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--ink-2)}
.ob-kind b{color:var(--ink);font-weight:500}
.ob-scan{border:1px solid var(--ok);background:var(--ok-soft);border-radius:12px;padding:12px 14px;margin:6px 0 4px}
.ob-scan .f{font-size:12.5px;color:var(--ink-2);font-family:var(--mono);overflow-wrap:anywhere}
.ob-counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.ob-cnt{background:var(--surface);border-radius:9px;padding:8px 10px}
.ob-cnt .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.ob-cnt .l{font-size:11.5px;color:var(--ink-2)}
.ob-seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.ob-seg button{border:0;background:none;border-radius:7px;padding:3px 10px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.ob-seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.rec-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rec-bar .who-btn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--ink-2)}
.rec-bar .who-btn.on{border-color:var(--ink);color:var(--ink);font-weight:500}
.interim{color:var(--ink-3);font-size:14px;padding:6px 0 0 64px;min-height:22px}
.setup-cta{margin-top:14px}
@media (max-width:640px){
  .ob-provs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ob-two{grid-template-columns:1fr}
  .ob-counts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ob-dl{flex-wrap:wrap}.ob-dl .grow{display:none}.ob-dl .btn{width:100%}
  .tb-extra .tb-btn .lbl{display:none}
  .interim{padding-left:0}
}
/* App chrome isn't selectable text (drags would highlight it); what you type and read stays selectable. */
.top,.nav,.brand,.tb-extra,.btn,.ghost,.linkbtn,.fchip,.stat,.label,.tbl th,.check,.bx,.ob-langs,.ob-tabs,.ob-prov,.ob-pill,.ob-seg,.ob-bars,.ob-eb,.tag,.due,.pill,.who-btn,.banner button{-webkit-user-select:none;user-select:none}
.ob-roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ob-role{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:8px 10px;text-align:left;font-size:13px;font-weight:500}
.ob-role small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3)}
.ob-role.sm{padding:5px 8px;font-size:12.5px;text-align:center}
.ob-role.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ob-teams{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:7px}
.ob-sug{border:1px dashed var(--border-strong);background:var(--surface);border-radius:999px;padding:4px 8px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ob-sug:hover,.ob-sug.on{border-style:solid;border-color:var(--ink);color:var(--ink)}
.ob-choice{display:grid;gap:8px;margin-top:6px}

/* mouse clicks don't leave a focus ring on these toggles; keyboard focus still shows one */
.ob-langs button:focus:not(:focus-visible),.ob-seg button:focus:not(:focus-visible),.ob-tabs button:focus:not(:focus-visible){outline:none}

@media (max-width:640px){.ob-card{padding:24px 20px 20px}.ob-card h2{font-size:26px}}
.brand svg{width:22px;height:22px;display:block;flex:none}
.ob-brand{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.ob-brand svg{width:44px;height:44px;flex:none}
.ob-brand .nm{font-weight:600;font-size:16px}
.ob-brand .tg{font-size:13px;color:var(--ink-3)}
.ob-open{margin-top:12px;border-radius:10px;background:var(--surface-2);padding:10px 12px}

<body>
<style>
/* Layout: a morning briefing. Main column = what to do; right rail = who you're waiting on and what they said. */
:root{
  --bg:#f6f6f3;--surface:#ffffff;--surface-2:#f0efeb;--hover:#ecebe6;
  --border:#e5e3dd;--border-strong:#d3d0c8;
  --ink:#1c1b19;--ink-2:#67645e;--ink-3:#9c988f;
  --accent:#2f56c9;--accent-soft:#e7ecfb;
  --danger:#bd3f2e;--danger-soft:#fae9e5;
  --warn:#9f6612;--warn-soft:#f8eedb;
  --ok:#2a7a4e;--ok-soft:#e3f1e8;
  --violet:#6548b3;--violet-soft:#eee9f9;
  --clay:#b95d38;--clay-soft:#f7e9e2;
  --on-ink:#ffffff;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131312;--surface:#1b1b1a;--surface-2:#242422;--hover:#2a2a27;
  --border:#2e2d2a;--border-strong:#3e3d39;
  --ink:#ecebe6;--ink-2:#a6a39b;--ink-3:#716e67;
  --accent:#88a5ff;--accent-soft:#1f2946;
  --danger:#f0836f;--danger-soft:#3a1f1a;
  --warn:#e2ab52;--warn-soft:#372a14;
  --ok:#68c690;--ok-soft:#173122;
  --violet:#b49df0;--violet-soft:#29223f;
  --clay:#e68d66;--clay-soft:#38241b;
  --on-ink:#131312;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131312;--surface:#1b1b1a;--surface-2:#242422;--hover:#2a2a27;
  --border:#2e2d2a;--border-strong:#3e3d39;
  --ink:#ecebe6;--ink-2:#a6a39b;--ink-3:#716e67;
  --accent:#88a5ff;--accent-soft:#1f2946;
  --danger:#f0836f;--danger-soft:#3a1f1a;
  --warn:#e2ab52;--warn-soft:#372a14;
  --ok:#68c690;--ok-soft:#173122;
  --violet:#b49df0;--violet-soft:#29223f;
  --clay:#e68d66;--clay-soft:#38241b;
  --on-ink:#131312;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
h1,h2,h3{text-wrap:balance;margin:0}
p,.t,.s,.d,.tx-t,.sum,.pv,.pd,.ans-r,.note-v{text-wrap:pretty}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{max-width:1100px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.top{display:flex;align-items:center;gap:18px;padding:13px 22px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.mark{width:20px;height:20px;border-radius:6px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-size:11px;font-weight:600}
.nav{display:flex;gap:2px}
.nav a{padding:5px 11px;border-radius:7px;color:var(--ink-2);font-size:13px;font-weight:500;text-decoration:none}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a.on{background:var(--surface-2);color:var(--ink)}
.grow{flex:1}
.ghost{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:8px;padding:5px 10px;font-size:12.5px}
.ghost:hover{border-color:var(--border-strong);color:var(--ink)}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:9px 22px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:12.5px;color:var(--ink-2)}
.banner b{color:var(--ink);font-weight:500}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px;font-weight:500}
.linkbtn.danger{color:var(--danger)}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px}
.main{padding:30px 32px 34px;min-width:0}
.rail{border-left:1px solid var(--border);background:var(--bg);padding:26px 22px;min-width:0}
.label{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:500;color:var(--ink-3);letter-spacing:.03em;margin:0 0 10px}
.label .c{font-variant-numeric:tabular-nums}
.label .act{margin-left:auto}
.sec{margin-top:28px}

.date{font-size:12.5px;color:var(--ink-3);margin-bottom:8px}
.hello{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.18;letter-spacing:-.01em}
.hello .l2{color:var(--ink-2)}
.sub{color:var(--ink-2);margin:10px 0 0;font-size:13.5px}

.tag{display:inline-block;font-size:11px;font-weight:500;padding:1px 7px;border-radius:5px;white-space:nowrap;line-height:1.6}
.P0{background:var(--danger-soft);color:var(--danger)}
.P1{background:var(--warn-soft);color:var(--warn)}
.P2{background:var(--surface-2);color:var(--ink-2)}
.who{background:var(--violet-soft);color:var(--violet)}
.okt{background:var(--ok-soft);color:var(--ok)}
.blk{background:var(--danger-soft);color:var(--danger)}

.item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.item+.item{margin-top:8px}
.item:hover{border-color:var(--border-strong)}
.check{width:18px;height:18px;border:1.5px solid var(--border-strong);border-radius:50%;flex:none;margin-top:1px;background:var(--surface);padding:0;position:relative}
.check:hover{border-color:var(--ok);background:var(--ok-soft)}
.item .body{flex:1;min-width:0;cursor:pointer}
.item .t{font-weight:500;font-size:14.5px}
.item .s{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.item .src{font-size:11.5px;color:var(--ok);margin-top:5px}
.item .tags{display:flex;gap:5px;flex:none;align-items:center}
.due{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.due.late{color:var(--danger);font-weight:500}
.adv{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.adv input{flex:1;min-width:180px}

.inp,.sel,.ta{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13.5px;width:100%}
.inp:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ta{min-height:90px;resize:vertical;line-height:1.55}
.btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.pri:hover{opacity:.9}
.btn.claude{background:var(--clay);border-color:var(--clay);color:#fff}
.btn.claude:hover{opacity:.92}
.btn.stop{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:3px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}

.row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;align-items:baseline}
.row:last-child{border-bottom:0}
.row .d{width:64px;flex:none;color:var(--ink-3);font-size:12.5px;font-variant-numeric:tabular-nums}
.row .t{flex:1;min-width:0}
.row.click{cursor:pointer}.row.click:hover .t{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
.card+.label{margin-top:22px}
.wait{padding:8px 0;border-bottom:1px solid var(--border)}
.wait:last-child{border-bottom:0}
.wait .h{display:flex;justify-content:space-between;gap:8px}
.wait .n{font-size:13.5px;font-weight:500}
.wait .age{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.wait .age.late{color:var(--danger);font-weight:500}
.wait .w{font-size:12.5px;color:var(--ink-2)}
.wait .acts{display:flex;gap:12px;margin-top:4px}
.draft{margin-top:8px;background:var(--surface-2);border-radius:8px;padding:9px 10px;font-size:13px;line-height:1.5;white-space:pre-wrap}
.draft .acts{margin-top:6px}
.ans{padding:8px 0;border-bottom:1px solid var(--border)}
.ans:last-child{border-bottom:0}
.ans .q{font-size:12px;color:var(--ink-2)}
.ans .ans-r{font-size:13.5px;margin:2px 0 5px}
.qgrp{font-size:12px;font-weight:500;color:var(--violet);margin:8px 0 2px}
.qgrp:first-child{margin-top:0}
.qline{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13px}
.qline .qt{flex:1;min-width:0}
.qline .linkbtn{font-size:11.5px;flex:none}
.empty{color:var(--ink-3);font-size:13px;padding:6px 0}
.capcard{display:flex;align-items:center;gap:10px;border:1px dashed var(--border-strong);border-radius:var(--r);padding:11px 13px;color:var(--ink-2);font-size:13px;text-decoration:none;background:var(--surface)}
.capcard:hover{border-color:var(--clay);color:var(--ink)}
.rec{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none}
.foot{max-width:1100px;margin:14px auto 0;color:var(--ink-3);font-size:12px;text-align:center}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,18,15,.38);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(440px,100%);height:100%;background:var(--surface);border-left:1px solid var(--border);overflow:auto;
  padding:22px 22px calc(28px + env(safe-area-inset-bottom,0px));padding-right:max(22px,env(safe-area-inset-right,0px));padding-top:calc(22px + env(safe-area-inset-top,0px))}
.drawer h2{font-size:17px;font-weight:600;margin-bottom:16px}
.f{margin-bottom:13px}
.f>label{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:5px;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hist{border-left:2px solid var(--border);padding-left:12px}
.hist .e{font-size:12.5px;margin-bottom:9px}
.hist .m{color:var(--ink-3);font-size:11.5px}
.dacts{display:flex;gap:8px;align-items:center;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:9px 14px;border-radius:10px;font-size:13px;z-index:60;display:flex;gap:12px;align-items:center}
.toast .linkbtn{color:var(--on-ink);text-decoration:underline}

/* capture */
.sess{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;padding:24px 28px 18px;border-bottom:1px solid var(--border)}
.sess .meta{min-width:0;flex:1 1 360px}
.sess h1{font-family:var(--display);font-weight:400;font-size:27px;line-height:1.2;letter-spacing:-.01em;margin:2px 0 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-2)}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.timer{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--danger)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--danger);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.wave{display:flex;align-items:center;gap:3px;height:30px;padding:0 28px;margin-top:12px;overflow:hidden}
.wave span{flex:1;max-width:4px;min-width:2px;border-radius:2px;background:var(--border-strong);transition:height .3s}
.wave.on span.hot{background:var(--danger)}
.setup{padding:22px 28px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-bottom:1px solid var(--border)}
.setup .wide{grid-column:1/-1}
.tx{padding:16px 28px 26px;min-width:0}
.line{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:8px 0}
.line .ts{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);padding-top:3px}
.line .spn{font-size:12px;font-weight:600;margin-bottom:1px}
.line .tx-t{font-size:14.5px;line-height:1.6;overflow-wrap:anywhere}
.me{color:var(--accent)}.them{color:var(--violet)}
mark{background:var(--ok-soft);color:inherit;border-radius:4px;padding:0 2px}
mark.pr{background:var(--warn-soft)}
.caret{display:inline-block;width:2px;height:15px;background:var(--ink-3);vertical-align:-2px;animation:pulse 1s steps(2) infinite;margin-left:2px}
.txbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.pill{font-size:12px;color:var(--ink-2);border:1px solid var(--border);border-radius:999px;padding:3px 10px}
.hint{font-size:12.5px;color:var(--ink-3)}
.emptytx{border:1px dashed var(--border-strong);border-radius:12px;padding:22px;text-align:center;display:grid;gap:12px;justify-items:center}
.emptytx p{margin:0;color:var(--ink-2);max-width:46ch}
.spark{width:18px;height:18px;border-radius:5px;background:var(--clay-soft);color:var(--clay);display:inline-grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.qbox{display:flex;gap:9px;padding:5px 0;font-size:13px;align-items:flex-start}
.qbox .bx{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--border-strong);flex:none;margin-top:2px;position:relative}
.qbox.done .bx{background:var(--ok);border-color:var(--ok)}
.qbox.done .bx::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.qbox.done .qt{color:var(--ink-2)}
.qbox .a{font-size:12px;color:var(--ok);margin-top:1px}
.note{border-top:1px solid var(--border);padding:9px 0 3px}
.note:first-child{border-top:0;padding-top:0}
.note .k{font-size:11px;font-weight:500;margin-bottom:2px}
.note .note-v{font-size:13.5px;line-height:1.45}
.note .to{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.thinking{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.dots i{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--ink-3);margin-right:2px;animation:pulse 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.err{font-size:12.5px;color:var(--danger);margin-top:6px}
.sum{font-family:var(--display);font-size:18.5px;line-height:1.55;margin:0 0 24px}
.prop{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:11px;padding:12px 14px;background:var(--surface)}
.prop+.prop{margin-top:8px}
.prop .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none}
.prop .b{flex:1;min-width:0}
.prop .k{font-size:11.5px;color:var(--ink-3)}
.prop .pv{font-size:14px;font-weight:500;margin:1px 0 2px}
.prop .pd{font-size:12.5px;color:var(--ink-2)}
.prop .acts{display:flex;gap:6px;flex:none;flex-wrap:wrap}
.prop.added{border-color:var(--ok);background:var(--ok-soft)}
.prop.skipped{opacity:.55}
.prop .edit{display:grid;gap:6px;margin-top:6px}
.applybar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding:12px 14px;border-radius:11px;background:var(--surface-2)}
.chat .m{font-size:13px;line-height:1.5;padding:7px 0;border-bottom:1px solid var(--border);white-space:pre-wrap}
.chat .m:last-child{border-bottom:0}
.chat .m.u{color:var(--ink-2)}
.ask{display:flex;gap:8px;margin-top:10px}
.past .row .t{font-weight:500}

/* tasks table + questions inbox */
.phead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:26px 30px 14px}
.phead h1{font-family:var(--display);font-weight:400;font-size:29px;line-height:1.2;letter-spacing:-.01em}
.phead .sub{color:var(--ink-2);font-size:13px;margin:4px 0 0}
.phead .inp{width:200px}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:4px 30px 0}
.stat{border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;background:var(--bg);text-align:left}
.stat:hover{border-color:var(--border-strong)}
.stat.on{border-color:var(--ink)}
.stat .v{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--ink-2)}
.fbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:14px 30px;border-bottom:1px solid var(--border)}
.fchip{font-size:12.5px;color:var(--ink-2);border:1px solid var(--border);border-radius:999px;padding:3px 11px;background:var(--surface)}
.fchip:hover{border-color:var(--border-strong);color:var(--ink)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.fbar .sel{width:auto;padding:4px 8px;font-size:12.5px}
.tbl-wrap{padding:4px 30px 28px;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:780px}
.tbl th{text-align:left;font-size:11px;font-weight:500;color:var(--ink-3);padding:10px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl th button{border:0;background:none;padding:0;font:inherit;color:inherit}
.tbl th button:hover{color:var(--ink)}
.tbl th .ar{margin-left:3px}
.tbl td{padding:11px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--hover)}
.tbl .t{font-weight:500}
.tbl .n{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.tbl tr.done .t{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;display:inline-block}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.qmain{padding:18px 30px 28px;min-width:0}
.addq{display:grid;grid-template-columns:minmax(0,1fr) 170px 200px auto;gap:8px;margin-bottom:12px}
.addq .two{grid-column:1/-1}
.qrow{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);align-items:start}
.qrow .bx{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border-strong);margin-top:3px;background:var(--surface);padding:0;position:relative}
.qrow .bx:hover{border-color:var(--ok)}
.qrow.done .bx{background:var(--ok);border-color:var(--ok)}
.qrow.done .bx::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.qrow .qt{font-weight:500}
.qrow.done .qt{color:var(--ink-2)}
.qrow .qm{font-size:12px;color:var(--ink-2);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qrow .qa{font-size:13px;color:var(--ok);margin-top:4px}
.qrow .r{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.qrow .ed{display:grid;gap:6px;margin-top:8px}
.tasklink{border:0;background:none;padding:0;font-size:12px;color:var(--accent)}
.tasklink:hover{text-decoration:underline}
.srow{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:6px 8px;border-radius:7px;font-size:13px;text-align:left}
.srow:hover{background:var(--hover)}
.srow.on{background:var(--surface-2);font-weight:500}
.agenda .i{font-size:13px;padding:6px 0;border-bottom:1px solid var(--border)}
.agenda .i:last-of-type{border-bottom:0}

@media (max-width:880px){
  .cols{grid-template-columns:1fr}
  .rail{border-left:0;border-top:1px solid var(--border)}
  .setup{grid-template-columns:1fr}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .addq{grid-template-columns:1fr}
  .nav{order:3;width:100%;overflow-x:auto}
}
@media (max-width:520px){
  .main,.tx,.sess,.setup,.phead,.strip,.fbar,.tbl-wrap,.qmain{padding-left:18px;padding-right:18px}
  .phead .inp{width:100%}
  .wave{padding:0 18px}
  .hello{font-size:26px}
  .two{grid-template-columns:1fr}
  .item{flex-wrap:wrap}
  .item .tags{width:100%;padding-left:30px}
  .prop{flex-wrap:wrap}
}

<script>
/* ---------- utilities ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY=()=>iso(new Date());
const addDays=(n,base)=>{const d=base?new Date(base+"T12:00:00"):new Date();d.setDate(d.getDate()+n);return iso(d);};
const diffDays=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDue(d){if(!d)return "";const n=diffDays(TODAY(),d);if(n<0)return n===-1?"Yesterday":Math.abs(n)+"d late";if(n===0)return "Today";if(n===1)return "Tomorrow";
  const x=new Date(d+"T12:00:00");return n<7?DOW[x.getDay()]:MON[x.getMonth()]+" "+x.getDate();}
function fmtLong(){const d=new Date();return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()]+", "+["January","February","March","April","May","June","July","August","September","October","November","December"][d.getMonth()]+" "+d.getDate();}
const PRI={P0:0,P1:1,P2:2};

/* Keep the last two words of every text block together so no line ends with a lone word. */
const GLUE_SEL="h1,h2,h3,p,.t,.s,.d,.w,.q,.qt,.ans-r,.tx-t,.sum,.pv,.pd,.note-v,.src,.hint";
function glue(root){
  (root||document).querySelectorAll(GLUE_SEL).forEach(el=>{
    if(el.closest("[contenteditable],textarea,input"))return;
    const words=el.textContent.trim().split(/\s+/);if(words.length<4)return;
    const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let last=null,n;
    while(n=w.nextNode())if(n.nodeValue.trim())last=n;
    if(!last)return;
    const v=last.nodeValue,m=v.match(/^([\s\S]*\S)[ \t]+(\S+\s*)$/);
    if(m)last.nodeValue=m[1]+" "+m[2];
  });
}

/* ---------- sample week (shown until you start your own board) ---------- */
function sampleState(){
  const D=addDays;
  return {v:1,sample:true,project:"Referral program v2",updatedAt:Date.now(),
    people:[
      {id:"p_maya",name:"Maya",team:"Data science"},
      {id:"p_priya",name:"Priya",team:"Data analytics"},
      {id:"p_leo",name:"Leo",team:"Engineering"},
      {id:"p_ana",name:"Ana",team:"Design"},
      {id:"p_sam",name:"Sam",team:"Mentor, PM"}],
    tasks:[
      {id:"t_metric",title:"Lock success metric for referral test",prio:"P0",status:"open",next:"Update metric spec with Maya's cohort definition",due:D(0),waiting:null,
        history:[{at:D(-4),text:"Created. Need one primary metric before PRD review."},{at:D(-3),text:"Asked Maya: cohort or rolling D7 retention?"},{at:D(-1),text:"Maya answered: per signup cohort, exclude reactivated users."}]},
      {id:"t_prd",title:"Draft PRD for in-app referral entry",prio:"P1",status:"open",next:"Write the edge cases section",due:D(2),waiting:null,history:[{at:D(-5),text:"Created from kickoff with Sam."}]},
      {id:"t_track",title:"Align event tracking spec with Eng",prio:"P0",status:"blocked",next:"Nudge Leo on the schema review",due:D(1),waiting:{personId:"p_leo",what:"Tracking schema review",since:D(-3)},history:[{at:D(-3),text:"Sent schema doc to Leo for review."}]},
      {id:"t_base",title:"Baseline funnel numbers",prio:"P1",status:"open",next:"Fold the baseline into the metric spec once it lands",due:D(3),waiting:{personId:"p_priya",what:"Last 30 days of funnel data by channel",since:D(-1)},history:[{at:D(-1),text:"Asked Priya for the 30-day baseline."}]},
      {id:"t_design",title:"Design review: referral entry point",prio:"P1",status:"open",next:"Prep three questions for the design review",due:D(1),waiting:null,history:[]},
      {id:"t_sync",title:"Weekly sync deck",prio:"P1",status:"open",next:"Add a slide on the metric definition and baseline",due:D(3),waiting:null,history:[]},
      {id:"t_ideas",title:"Collect ideas for the next iteration",prio:"P2",status:"open",next:"Skim support tickets tagged invite",due:null,waiting:null,history:[]},
      {id:"t_kick",title:"Send kickoff notes to stakeholders",prio:"P1",status:"done",next:"",due:D(-4),waiting:null,history:[{at:D(-4),text:"Done."}]}],
    questions:[
      {id:"q_d7",personId:"p_maya",taskId:"t_metric",text:"Cohort or rolling D7 retention?",answer:"Per signup cohort; exclude reactivated users.",answeredAt:D(-1),created:D(-3)},
      {id:"q_ss",personId:"p_maya",taskId:"t_metric",text:"Minimum sample size to detect a 2% lift?",answer:"",answeredAt:null,created:D(-3)},
      {id:"q_gr",personId:"p_maya",taskId:"t_metric",text:"Should the guardrail include cancel rate?",answer:"",answeredAt:null,created:D(-3)},
      {id:"q_dl",personId:"p_leo",taskId:"t_prd",text:"Can the referral entry deep link from SMS?",answer:"",answeredAt:null,created:D(-6)},
      {id:"q_sh",personId:"p_ana",taskId:"t_design",text:"Is the share sheet native or custom?",answer:"",answeredAt:null,created:D(-5)}],
    sessions:[],
    draft:null};
}
function emptyState(){return {v:1,sample:false,project:"My project",updatedAt:Date.now(),people:[],tasks:[],questions:[],sessions:[],draft:null};}

const SAMPLE_TRANSCRIPT=[
  ["You","Thanks for making time. For the referral test, should D7 retention be per cohort or rolling? I want one number I can put in the PRD."],
  ["Maya","Per signup cohort. And exclude reactivated users, otherwise the invite channel looks better than it really is."],
  ["You","Makes sense. What sample size would we need to see a two percent lift?"],
  ["Maya","Roughly forty thousand users per arm at current traffic. I'll send you the power calc by Thursday."],
  ["You","Great. I'll update the metric spec today and share it in Friday's sync."],
  ["Maya","Also check with Priya whether the baseline already splits by channel. If it doesn't, we can't compare invite against organic."],
  ["You","Good call, I'll ask her this afternoon. One more thing, should we run it on Android first?"],
  ["Maya","I'd run both platforms together. Splitting them halves the sample and we'd wait twice as long."],
  ["You","Okay, both platforms. I'll note that in the PRD's rollout section."]
];

/* ---------- storage: private doc in your Claude account, else this browser ---------- */
let S=null,mode="loading",dbRef=null,writing=false,dirty=false,saveTimer=0;
const LS_KEY="pm-tracker-v1";
function lsGet(){try{const s=localStorage.getItem(LS_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function lsSet(o){try{localStorage.setItem(LS_KEY,JSON.stringify(o));}catch(e){}}
function save(){S.updatedAt=Date.now();clearTimeout(saveTimer);saveTimer=setTimeout(flush,600);}
async function flush(){
  if(mode!=="cloud"){lsSet(S);return;}
  if(writing){dirty=true;return;}
  writing=true;dirty=false;
  try{await dbRef.set(JSON.parse(JSON.stringify(S)));}
  catch(e){if(e&&e.code==="unavailable"){setTimeout(()=>{dirty=true;},1500);}else{mode="local";lsSet(S);renderFoot();}}
  writing=false;if(dirty)flush();
}
async function boot(){
  S=lsGet()||sampleState();mode="local";render();
  try{
    const C=window.claude;if(!C||!C.use)return finishBoot();
    const [db,user]=await Promise.all([C.use("db"),C.use("user")]);
    USER=user;
    if(user){try{const me=await user.me();ME=me.name||"";}catch(e){}}
    const id=user?await user.id():null;
    if(db&&id){
      dbRef=db.doc("data/users/"+id+"/board");
      const snap=await dbRef.get();
      if(snap.exists){S=JSON.parse(JSON.stringify(snap.data()));}
      mode="cloud";
    }
  }catch(e){mode="local";}
  finishBoot();
}
function finishBoot(){normalize();render();renderFoot();initClaude();}
function normalize(){["people","tasks","questions","sessions"].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[];});}
function renderFoot(){$("#foot").textContent=mode==="cloud"?"Saved privately to your Claude account":"Saved in this browser only";}

/* ---------- Claude ---------- */
let CLAUDE=null,USER=null,ME="";
async function initClaude(){try{CLAUDE=window.claude&&window.claude.use?await window.claude.use("sample"):null;}catch(e){CLAUDE=null;}render();}
function claudeErr(e){const c=e&&e.code;
  if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled"){CLAUDE=null;return "Claude isn't available for this page. You can still add everything by hand.";}
  if(c==="rate_limited")return "Too many requests right now. Try again in a minute.";
  if(c==="invalid_json")return "Claude's reply came back in the wrong shape. Try again.";
  if(c==="prompt_too_large")return "That transcript is too long. Trim it and try again.";
  if(c==="cancelled")return "";
  return "Claude couldn't finish that. Try again.";}

/* ---------- lookups ---------- */
const person=id=>S.people.find(p=>p.id===id);
const task=id=>S.tasks.find(t=>t.id===id);
const pName=id=>{const p=person(id);return p?p.name:"Someone";};
const pLabel=id=>{const p=person(id);return p?p.name+" · "+shortTeam(p.team):"Someone";};
function shortTeam(t){const m={"data science":"DS","data analytics":"DA","engineering":"Eng","design":"Design","operations":"Ops","product":"PM","mentor, pm":"Mentor"};return m[(t||"").toLowerCase()]||t||"";}
function openTasks(){return S.tasks.filter(t=>t.status!=="done");}
function waitAge(t){return t.waiting?Math.max(0,diffDays(t.waiting.since,TODAY())):0;}
function sortTasks(a,b){return PRI[a.prio]-PRI[b.prio]||((a.due||"9999")<(b.due||"9999")?-1:(a.due||"9999")>(b.due||"9999")?1:0);}

/* ---------- UI state ---------- */
const UI={advancing:null,drawer:null,confirmDel:false,nudge:{},nudgeBusy:{},nudgeErr:{},askQ:false,answering:null,toast:null,confirmFresh:false,
  tFilter:"open",tSort:{k:"prio",dir:1},tSearch:"",qFilter:"ask",qPerson:"",agendaPerson:"",qEdit:null,qDel:null,qAnswer:null};
const ROUTES=["today","tasks","questions","capture"];
let ROUTE=(h=>ROUTES.includes(h)?h:"today")(location.hash.slice(1));
function route(){return ROUTE;}
function go(r){if(!ROUTES.includes(r))r="today";ROUTE=r;try{history.replaceState(null,"","#"+r);}catch(e){}render();window.scrollTo(0,0);}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(ROUTES.includes(h)&&h!==ROUTE)go(h);});
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const r=a.getAttribute("href").slice(1);if(ROUTES.includes(r)){e.preventDefault();go(r);}},true);

function render(){
  if(!S)return;
  const r=route();
  ROUTES.forEach(x=>$("#nav-"+x).classList.toggle("on",r===x));
  $("#banner").innerHTML=S.sample?`<div class="banner"><span><b>Sample week.</b> A made-up PM internship so you can try everything. Edits are saved.</span><span class="grow"></span>${UI.confirmFresh?`<span>Clear the sample and start empty?</span><button class="linkbtn danger" data-act="fresh-yes">Clear it</button><button class="linkbtn" data-act="fresh-no">Keep it</button>`:`<button class="linkbtn" data-act="fresh">Start my own board</button>`}</div>`:"";
  $("#view").innerHTML=r==="capture"?viewCapture():r==="tasks"?viewTasks():r==="questions"?viewQuestions():viewToday();
  renderOverlay();renderToast();glue();
  if(r==="capture")afterCapture();
  if(r==="tasks"||r==="questions")afterLists();
}

/* ---------- Today ---------- */
function greeting(){const h=new Date().getHours();return h<12?"Good morning":h<18?"Good afternoon":"Good evening";}
function viewToday(){
  const open=openTasks().sort(sortTasks);
  const now=open.filter(t=>t.status!=="blocked"&&(t.prio==="P0"||(t.due&&diffDays(TODAY(),t.due)<=1)));
  const later=open.filter(t=>!now.includes(t)&&t.status!=="blocked");
  const blocked=open.filter(t=>t.status==="blocked");
  const waits=open.filter(t=>t.waiting).sort((a,b)=>waitAge(b)-waitAge(a));
  const nudge=waits.filter(t=>waitAge(t)>=2).length;
  const fresh=S.questions.filter(q=>q.answer&&q.answeredAt&&diffDays(q.answeredAt,TODAY())<=2).sort((a,b)=>a.answeredAt<b.answeredAt?1:-1);
  const l2=now.length||nudge?`${now.length?`${now.length===1?"One move":cap(num(now.length))+" moves"} today`:"No urgent moves today"}${nudge?`, ${nudge===1?"one person":num(nudge)+" people"} to nudge`:""}.`:"Nothing urgent. A good day to get ahead.";
  const name=ME?ME.split(" ")[0]:"";
  const week=open.filter(t=>t.due&&diffDays(TODAY(),t.due)>=0&&diffDays(TODAY(),t.due)<7).sort((a,b)=>a.due<b.due?-1:1);
  const sub=[S.project,open.length+" open",blocked.length?blocked.length+" blocked":"",fresh.length?fresh.length+(fresh.length===1?" answer":" answers")+" since yesterday":""].filter(Boolean).join(" · ");

  return `<div class="cols"><section class="main">
    <div class="date">${fmtLong()}</div>
    <h1 class="hello"><span>${greeting()}${name?", "+esc(name):""}.</span><br><span class="l2">${l2}</span></h1>
    <p class="sub">${esc(sub)}</p>

    <div class="sec"><div class="label">Next actions <span class="c">${now.length}</span><span class="act"><button class="btn sm" data-act="new-task">Add task</button></span></div>
      ${now.length?now.map(itemHTML).join(""):`<p class="empty">${open.length?"Nothing due today. Pick something from Later.":"Add your first task to see your next moves here."}</p>`}
    </div>
    ${blocked.length?`<div class="sec"><div class="label">Blocked <span class="c">${blocked.length}</span></div>${blocked.map(itemHTML).join("")}</div>`:""}
    ${later.length?`<div class="sec"><div class="label">Later <span class="c">${later.length}</span></div>${later.map(itemHTML).join("")}</div>`:""}
    <div class="sec"><div class="label">This week</div>
      ${week.length?week.map(t=>`<div class="row click" data-act="open" data-id="${t.id}"><span class="d">${fmtDue(t.due)}</span><span class="t">${esc(t.title)}</span></div>`).join(""):`<p class="empty">No due dates in the next seven days.</p>`}
    </div>
    ${doneHTML()}
  </section>
  <aside class="rail">
    <div class="label">Waiting on <span class="c">${waits.length}</span></div>
    <div class="card">${waits.length?waits.map(waitHTML).join(""):`<p class="empty">Nobody owes you anything right now.</p>`}</div>
    <div class="label">New answers</div>
    <div class="card">${fresh.length?fresh.map(q=>`<div class="ans"><div class="q">${esc(pLabel(q.personId))} · ${esc(q.text)}</div><div class="ans-r">${esc(q.answer)}</div>${task(q.taskId)?`<span class="tag okt">${esc(task(q.taskId).title)}</span>`:""}</div>`).join(""):`<p class="empty">Answers you log or capture show up here.</p>`}</div>
    <div class="label">Questions to ask <span class="c">${S.questions.filter(q=>!q.answer).length}</span><span class="act"><button class="linkbtn" data-act="ask-q">Add</button></span></div>
    <div class="card">${questionsHTML()}</div>
    <div class="label" style="margin-top:22px">Capture</div>
    <a class="capcard" href="#capture"><span class="rec"></span>Capture a 1:1 and let Claude pull out answers</a>
  </aside></div>`;
}
const NUMW=["zero","one","two","three","four","five","six","seven","eight","nine","ten"];
const num=n=>NUMW[n]||String(n);const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function itemHTML(t){
  const late=t.due&&diffDays(TODAY(),t.due)<0;
  const lastAns=S.questions.filter(q=>q.taskId===t.id&&q.answer&&q.answeredAt&&diffDays(q.answeredAt,TODAY())<=2).sort((a,b)=>a.answeredAt<b.answeredAt?1:a.answeredAt>b.answeredAt?-1:S.questions.indexOf(b)-S.questions.indexOf(a))[0];
  return `<div class="item">
    <button class="check" data-act="advance" data-id="${t.id}" aria-label="Finish this step"></button>
    <div class="body" data-act="open" data-id="${t.id}">
      <div class="t">${esc(t.next||t.title)}</div>
      <div class="s">${t.next?esc(t.title):"No next step yet"}${t.waiting?` · waiting on ${esc(pName(t.waiting.personId))}`:""}</div>
      ${lastAns?`<div class="src">From ${esc(pName(lastAns.personId))}'s answer: ${esc(lastAns.answer)}</div>`:""}
      ${UI.advancing===t.id?`<div class="adv" data-stop>
        <input class="inp" id="advInput" placeholder="What's the next step?" aria-label="Next step">
        <button class="btn pri" data-act="adv-save" data-id="${t.id}">Set next step</button>
        <button class="btn" data-act="adv-done" data-id="${t.id}">Task is done</button>
        <button class="btn" data-act="adv-cancel">Cancel</button></div>`:""}
    </div>
    <div class="tags">${t.status==="blocked"?`<span class="tag blk">Blocked</span>`:""}${t.due?`<span class="due${late?" late":""}">${fmtDue(t.due)}</span>`:""}<span class="tag ${t.prio}">${t.prio}</span></div>
  </div>`;
}
function doneHTML(){const d=S.tasks.filter(t=>t.status==="done");if(!d.length)return "";
  return `<div class="sec"><div class="label">Done <span class="c">${d.length}</span></div>${d.map(t=>`<div class="row click" data-act="open" data-id="${t.id}"><span class="d">Done</span><span class="t" style="color:var(--ink-2)">${esc(t.title)}</span></div>`).join("")}</div>`;}
function waitHTML(t){
  const a=waitAge(t),late=a>=3,w=t.waiting;
  return `<div class="wait"><div class="h"><span class="n">${esc(pLabel(w.personId))}</span><span class="age${late?" late":""}">${a===0?"today":a+"d"}</span></div>
    <div class="w">${esc(w.what)}</div>
    <div class="acts">${CLAUDE?`<button class="linkbtn" data-act="nudge" data-id="${t.id}">${UI.nudgeBusy[t.id]?"Drafting…":"Draft a nudge"}</button>`:""}<button class="linkbtn" data-act="got-it" data-id="${t.id}">Got it</button></div>
    ${UI.nudgeErr[t.id]?`<div class="err">${esc(UI.nudgeErr[t.id])}</div>`:""}
    ${UI.nudge[t.id]?`<div class="draft">${esc(UI.nudge[t.id])}<div class="acts"><button class="linkbtn" data-act="copy-nudge" data-id="${t.id}">Copy</button> <button class="linkbtn" data-act="close-nudge" data-id="${t.id}">Close</button></div></div>`:""}
  </div>`;
}
function questionsHTML(){
  const open=S.questions.filter(q=>!q.answer);
  let h="";
  if(UI.askQ){h+=`<div style="display:grid;gap:6px;margin-bottom:10px">
    <select class="sel" id="qPerson" aria-label="Who to ask">${S.people.map(p=>`<option value="${p.id}">${esc(pLabel(p.id))}</option>`).join("")}<option value="__new">New person…</option></select>
    <div id="qNewPerson" hidden class="two"><input class="inp" id="qNewName" placeholder="Name"><input class="inp" id="qNewTeam" placeholder="Team"></div>
    <input class="inp" id="qText" placeholder="Is the baseline split by channel?" aria-label="Question">
    <select class="sel" id="qTask" aria-label="Related task"><option value="">No related task</option>${openTasks().map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join("")}</select>
    <div style="display:flex;gap:6px"><button class="btn pri sm" data-act="q-save">Add question</button><button class="btn sm" data-act="q-cancel">Cancel</button></div></div>`;}
  if(!open.length)return h+(UI.askQ?"":`<p class="empty">No open questions.</p>`);
  const by={};open.forEach(q=>(by[q.personId]=by[q.personId]||[]).push(q));

function tPass(t){const f=UI.tFilter,s=tStatus(t);
  if(f==="open"&&s==="done")return false;if(f==="mine"&&s!=="open")return false;
  if(f==="waiting"&&s!=="waiting")return false;if(f==="blocked"&&s!=="blocked")return false;if(f==="done"&&s!=="done")return false;

function tCompare(a,b){const {k,dir}=UI.tSort;let x,y;
  if(k==="prio"){x=PRI[a.prio];y=PRI[b.prio];if(x===y)return sortTasks(a,b);}
  else if(k==="due"){x=a.due||"9999";y=b.due||"9999";}

function extractPrompt(d,full){
  return `You help someone who coordinates work with other people turn a meeting transcript into updates for their task tracker. Today is ${TODAY()}.

Board and meeting context (JSON):
${boardContext(d)}

Transcript ("You" is the person whose board this is):
"""
${d.transcript.slice(0,60000)}
"""

Reply with only JSON in this shape:
{"summary": "${full?"2-3 plain sentences: what was decided, who owes what":"one sentence"}", "items": [ ... ]}

Each item:
{"type": "answer" | "next_action" | "waiting" | "question" | "task" | "still_open",
 "taskId": id of an existing task or null,
 "questionId": id of an existing open question (for answer and still_open) or null,
 "personId": id of an existing person or null,
 "title": short, at most 70 characters,
 "detail": one line, at most 110 characters,
 "due": "YYYY-MM-DD" or null,
 "quote": an exact phrase copied from the transcript, at most 80 characters, or null}

Meaning of each type:
- answer: an existing open question was answered. title = the question, detail = the answer in plain words.
- next_action: what the PM should do next on an existing task. title = the action, verb first.
- waiting: something another person promised to deliver. title = what, personId = who, due if a day was named.
- question: a new follow-up question the PM should ask someone. title = the question, personId = who to ask.
- task: new work that no existing task covers. title = the task, detail = its first step.
- still_open: an open question for the person in this meeting that the transcript did not cover. title = the question.
Use only ids from the context. Resolve weekday names to dates after today. ${full?"At most 8 items.":"At most 5 items, the most important first."}`;
}

function applyItem(it,d){
  const src="From "+(d.title||"capture");
  const t=task(it.taskId)||task(d.taskId);
  if(it.type==="answer"){
    let q=S.questions.find(x=>x.id===it.questionId)||S.questions.find(x=>!x.answer&&x.text.toLowerCase()===it.title.toLowerCase());
    if(!q){q={id:uid("q_"),personId:it.personId||d.personId||"",taskId:t?t.id:"",text:it.title,answer:"",answeredAt:null};S.questions.push(q);}
    q.answer=it.detail||it.title;q.answeredAt=TODAY();
    const qt=task(q.taskId);if(qt)qt.history.push({at:TODAY(),text:pName(q.personId)+" answered: "+q.answer});
  }else if(it.type==="next_action"){
    if(t){if(t.next)t.history.push({at:TODAY(),text:"Step done: "+t.next});t.next=it.title;if(it.due)t.due=it.due;if(t.status==="blocked"&&!t.waiting)t.status="open";t.history.push({at:TODAY(),text:src+": next step set."});}

  }else if(it.type==="waiting"){
    const w={personId:it.personId||d.personId||"",what:it.title,since:TODAY()};
    if(t){t.waiting=w;if(it.due&&(!t.due||it.due<t.due))t.due=it.due;t.history.push({at:TODAY(),text:src+": waiting on "+pName(w.personId)+" for "+it.title});}
    else S.tasks.push({id:uid("t_"),title:it.title,prio:"P1",status:"open",next:"Follow up when it arrives",due:it.due,waiting:w,history:[{at:TODAY(),text:src}]});
  }else if(it.type==="question"){
    S.questions.push({id:uid("q_"),personId:it.personId||d.personId||"",taskId:t?t.id:"",text:it.title,answer:"",answeredAt:null,created:TODAY()});
  }else if(it.type==="task"){
    S.tasks.push({id:uid("t_"),title:it.title,prio:"P1",status:"open",next:it.detail||"",due:it.due,waiting:null,history:[{at:TODAY(),text:src}]});
  }
}

    case "new-task":UI.drawer="new";UI.confirmDel=false;renderOverlay();break;
    case "open":if(e.target.closest(".adv"))return;UI.drawer=id;UI.confirmDel=false;renderOverlay();glue($("#overlay"));break;
    case "close-drawer":UI.drawer=null;UI.confirmDel=false;renderOverlay();break;
    /* tasks table */
    case "t-filter":UI.tFilter=id;render();break;
    case "t-sort":UI.tSort=UI.tSort.k===id?{k:id,dir:-UI.tSort.dir}:{k:id,dir:1};render();break;
    case "t-done":{undoSnap=JSON.stringify(S);const t=task(id);if(t.status==="done"){t.status="open";t.history.push({at:TODAY(),text:"Reopened."});save();render();toast("Reopened",true);}
      else{t.status="done";t.waiting=null;t.history.push({at:TODAY(),text:"Done."});save();render();toast("Marked done",true);}break;}
    /* questions inbox */
    case "q-filter":UI.qFilter=id;render();break;
    case "q-person":UI.qPerson=id;UI.agendaPerson="";render();break;
    case "q-log":UI.qAnswer=id;UI.qEdit=null;render();setTimeout(()=>{const x=$("#qaText");if(x)x.focus();},0);break;
    case "qa-cancel":UI.qAnswer=null;render();break;
    case "qa-save":{const v=$("#qaText").value.trim();if(!v){$("#qaText").focus();return;}const q=S.questions.find(x=>x.id===id);q.answer=v;q.answeredAt=TODAY();const t=task(q.taskId);if(t)t.history.push({at:TODAY(),text:pName(q.personId)+" answered: "+v});UI.qAnswer=null;save();render();toast("Answer saved");break;}
    case "q-reopen":{undoSnap=JSON.stringify(S);const q=S.questions.find(x=>x.id===id);q.answer="";q.answeredAt=null;save();render();toast("Moved back to To ask",true);break;}
    case "q-edit":UI.qEdit=id;UI.qAnswer=null;render();setTimeout(()=>{const x=$("#qeText");if(x)x.focus();},0);break;
    case "qe-cancel":UI.qEdit=null;render();break;
    case "qe-save":{const q=S.questions.find(x=>x.id===id),v=$("#qeText").value.trim();if(!v){$("#qeText").focus();return;}q.text=v;q.personId=$("#qePerson").value;q.taskId=$("#qeTask").value;const an=$("#qeAnswer");if(an)q.answer=an.value.trim()||q.answer;UI.qEdit=null;save();render();break;}
    case "q-del":UI.qDel=id;render();break;
    case "qd-no":UI.qDel=null;render();break;
    case "qd-yes":{undoSnap=JSON.stringify(S);S.questions=S.questions.filter(x=>x.id!==id);UI.qDel=null;save();render();toast("Question deleted",true);break;}
    case "copy-agenda":{const ap=agendaPerson();const items=S.questions.filter(q=>!q.answer&&q.personId===ap);copy("1:1 with "+pName(ap)+"\n"+items.map(q=>"- "+q.text).join("\n"));break;}
    case "start-capture":startCaptureFor(id);break;
    case "save-task":saveTask();break;
    case "del":UI.confirmDel=true;renderOverlay();break;
    case "del-no":UI.confirmDel=false;renderOverlay();break;
    case "del-yes":{undoSnap=JSON.stringify(S);const t=task(UI.drawer);S.tasks=S.tasks.filter(x=>x.id!==UI.drawer);UI.drawer=null;UI.confirmDel=false;save();render();toast("Deleted "+(t?t.title:"task"),true);break;}
    case "advance":UI.advancing=id;render();setTimeout(()=>{const x=$("#advInput");if(x)x.focus();},0);break;
    case "adv-cancel":UI.advancing=null;render();break;
    case "adv-save":{const t=task(id),v=$("#advInput").value.trim();if(!v){$("#advInput").focus();return;}if(t.next)t.history.push({at:TODAY(),text:"Step done: "+t.next});t.next=v;UI.advancing=null;save();render();toast("Next step set");break;}
    case "adv-done":{undoSnap=JSON.stringify(S);const t=task(id);t.status="done";t.waiting=null;t.history.push({at:TODAY(),text:"Done."});UI.advancing=null;save();render();toast("Marked done",true);break;}
    case "nudge":draftNudge(id);break;
    case "copy-nudge":copy(UI.nudge[id]);break;
    case "close-nudge":delete UI.nudge[id];render();break;
    case "got-it":{undoSnap=JSON.stringify(S);const t=task(id);t.history.push({at:TODAY(),text:"Got "+t.waiting.what+" from "+pName(t.waiting.personId)+"."});t.waiting=null;if(t.status==="blocked")t.status="open";save();render();toast("Cleared",true);break;}
    case "ask-q":UI.askQ=true;render();setTimeout(()=>{const s=$("#qPerson");if(s){s.onchange=()=>{$("#qNewPerson").hidden=s.value!=="__new";};if(!S.people.length){s.value="__new";$("#qNewPerson").hidden=false;}}const x=$("#qText");if(x)x.focus();},0);break;
    case "q-cancel":UI.askQ=false;render();break;
    case "q-save":{const txt=$("#qText").value.trim();if(!txt){$("#qText").focus();return;}let pid=$("#qPerson").value;
      if(pid==="__new"){const n=$("#qNewName").value.trim();if(!n){$("#qNewName").focus();return;}pid=addPerson(n,$("#qNewTeam").value);}
      S.questions.push({id:uid("q_"),personId:pid,taskId:$("#qTask").value,text:txt,answer:"",answeredAt:null,created:TODAY()});UI.askQ=false;save();render();break;}
    case "answer":UI.answering=id;render();setTimeout(()=>{const x=$("#ansText");if(x)x.focus();},0);break;
    case "ans-cancel":UI.answering=null;render();break;
    case "ans-save":{const v=$("#ansText").value.trim();if(!v)return;const q=S.questions.find(x=>x.id===id);q.answer=v;q.answeredAt=TODAY();const t=task(q.taskId);if(t)t.history.push({at:TODAY(),text:pName(q.personId)+" answered: "+v});UI.answering=null;save();render();break;}
    /* capture */
    case "replay":startReplay();break;
    case "replay-stop":stopReplay();break;
    case "edit-tx":CAP.editing=true;render();break;
    case "edit-done":CAP.editing=false;render();break;
    case "clear-tx":undoSnap=JSON.stringify(S);D.transcript="";D.notes=null;CAP.elapsed=0;save();render();toast("Transcript cleared",true);break;
    case "live-extract":liveExtract();break;
    case "finish":finish();break;
    case "retry-review":finish();break;
    case "back-edit":D.phase="setup";save();render();break;
    case "copy-summary":copy(D.review.summary);break;
    case "close-session":closeSession();break;
    case "add":applyItem(D.review.items[i],D);D.review.state[i]="added";save();render();break;
    case "skip":D.review.state[i]="skipped";save();render();break;
    case "unskip":delete D.review.state[i];save();render();break;
    case "pe":UI.editProp=i;render();break;
    case "pe-cancel":UI.editProp=null;render();break;
    case "pe-save":{const it=D.review.items[i];it.title=$("#peTitle").value.trim()||it.title;it.detail=$("#peDetail").value.trim();UI.editProp=null;save();render();break;}
    case "apply-all":D.review.items.forEach((it,j)=>{if(!D.review.state[j]){applyItem(it,D);D.review.state[j]="added";}});save();render();toast("Board updated");break;
    case "skip-rest":D.review.items.forEach((it,j)=>{if(!D.review.state[j])D.review.state[j]="skipped";});save();render();break;
    case "chat-stop":if(CAP.ctl)CAP.ctl.abort();break;
  }
});

  }
});

function zhDay(w){const k=w.charAt(0).toUpperCase()+w.slice(1);return ZDOW[k]||({Today:"今天",Yesterday:"昨天",Tomorrow:"明天"}[k])||(/^\w{3} \d+$/.test(k)?`${ZMON[k.slice(0,3)]} 月 ${k.slice(4)} 日`:w);}
function zh1(s){if(Object.prototype.hasOwnProperty.call(ZH,s))return ZH[s];for(const [re,f] of RULES){const m=s.match(re);if(m)return f(...m);}return null;}
/* a line like "7 open · 1 blocked" is translated part by part */
function zh(s){const one=zh1(s);if(one!=null)return one;if(!s.includes(" · "))return null;const parts=s.split(" · "),out=parts.map(x=>zh1(x));return out.some(x=>x!=null)?parts.map((x,i)=>out[i]!=null?out[i]:x).join(" · "):null;}
const ORIG=new WeakMap();
function localize(root){
  const nm=aiName();
  const fix=v=>v.replace(/\bClaude\b/g,nm);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentNode&&n.parentNode.closest&&n.parentNode.closest("textarea,script,style,[data-raw]")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];let n;while(n=w.nextNode())nodes.push(n);
  nodes.forEach(n=>{if(!ORIG.has(n))ORIG.set(n,n.nodeValue);const raw=ORIG.get(n);if(!raw.trim())return;const key=raw.replace(/\u00a0/g," ").trim();
    let out=L()==="zh"?zh(key):null;if(out==null)out=raw;else{const lead=raw.match(/^\s*/)[0],trail=raw.match(/\s*$/)[0];out=lead+out+trail;}
    out=fix(out);if(out!==n.nodeValue)n.nodeValue=out;});
  root.querySelectorAll&&root.querySelectorAll("[placeholder],[aria-label],[title]").forEach(el=>["placeholder","aria-label","title"].forEach(a=>{const k="data-en-"+a;if(!el.hasAttribute(k)&&el.hasAttribute(a))el.setAttribute(k,el.getAttribute(a));const v=el.getAttribute(k);if(!v)return;let o=L()==="zh"?zh(v):null;o=fix(o==null?v:o);if(o!==el.getAttribute(a))el.setAttribute(a,o);}));
}

/* ---------- even rows: never leave one chip or button alone on a line ---------- */
function rowsOf(kids){const rows=[];let bottom=-1e9;kids.map(k=>[k,k.getBoundingClientRect()]).sort((a,b)=>a[1].top-b[1].top).forEach(([k,r])=>{if(r.top>=bottom-1){rows.push([k]);bottom=r.bottom;}else{rows[rows.length-1].push(k);bottom=Math.max(bottom,r.bottom);}});return rows;}
function evenRows(root){(root||document).querySelectorAll(".ob-pills,.ob-chips,.ob-setrow,.fbar,.chips,.txbar,.ob-provs").forEach(el=>{
  el.classList.remove("ob-even");el.style.gridTemplateColumns="";
  const kids=[...el.children].filter(k=>k.getBoundingClientRect().width>0&&!k.classList.contains("grow")&&!k.classList.contains("l"));if(kids.length<3)return;
  const rows=rowsOf(kids);if(rows.length<2||rows[rows.length-1].length!==1)return;
  el.classList.add("ob-even");el.style.gridTemplateColumns=`repeat(${Math.ceil(kids.length/rows.length)},minmax(0,auto))`;});}
window.addEventListener("resize",()=>evenRows(document));

function validBoard(b){return b&&Array.isArray(b.tasks)&&Array.isArray(b.questions)&&Array.isArray(b.people);}
function readImport(file){
  OB.impErr="";const r=new FileReader();
  r.onload=async()=>{const text=String(r.result||"");let j=null;try{j=JSON.parse(text);}catch(e){}
    const board=j&&(validBoard(j.board)?j.board:validBoard(j)?j:null);
    if(board){OB.imp={file:file.name+" · "+Math.max(1,Math.round(file.size/1024))+" KB",board,date:j.exportedAt?fmtDate(j.exportedAt):"—",version:j.version||"1.0",ai:false};openOB("scanned");return;}
    if(!CLAUDE){OB.impErr=t("imp_bad");drawOB();return;}
    OB.impBusy=true;drawOB();
    try{const out=await CLAUDE.json(`Turn these notes into a task board for someone who coordinates work with other people. Today is ${TODAY()}.
Reply with only JSON: {"people":[{"name":"","team":""}],"tasks":[{"title":"","next":"","prio":"P0|P1|P2","due":"YYYY-MM-DD or null","waitingOn":"person name or null","waitingFor":"what they owe or null"}],"questions":[{"text":"","person":"person name","answer":"answer if the notes contain one, else empty"}]}
Use only what the notes say. At most 40 tasks and 40 questions.

Notes (${file.name}):
"""
${text.slice(0,60000)}
"""`,{modelTier:"default"});
      const b=fromAI(out);if(!b.tasks.length&&!b.questions.length)throw {code:"empty"};
      OB.imp={file:file.name+" · "+Math.max(1,Math.round(file.size/1024))+" KB",board:b,ai:true};OB.impBusy=false;openOB("scanned");
    }catch(e){OB.impBusy=false;OB.impErr=e&&e.code==="empty"?t("imp_none"):claudeErr(e);drawOB();}
  };
  r.readAsText(file);
}
function fmtDate(isoStr){const d=new Date(isoStr);if(isNaN(d))return "—";return L()==="zh"?`${d.getMonth()+1} 月 ${d.getDate()} 日`:MON[d.getMonth()]+" "+d.getDate();}
function fromAI(o){const b=emptyState();b.project=P.project||b.project;const byName={};
  const pid=n=>{n=String(n||"").trim();if(!n)return "";const k=n.toLowerCase();if(!byName[k]){const p={id:uid("p_"),name:n,team:""};b.people.push(p);byName[k]=p.id;}return byName[k];};
  (o.people||[]).forEach(p=>{const id=pid(p.name);const pp=b.people.find(x=>x.id===id);if(pp&&p.team)pp.team=String(p.team);});
  (o.tasks||[]).slice(0,40).forEach(x=>{if(!x||!x.title)return;const w=x.waitingOn?{personId:pid(x.waitingOn),what:String(x.waitingFor||"A reply"),since:TODAY()}:null;
    b.tasks.push({id:uid("t_"),title:String(x.title),prio:["P0","P1","P2"].includes(x.prio)?x.prio:"P1",status:"open",next:String(x.next||""),due:/^\d{4}-\d{2}-\d{2}$/.test(x.due||"")?x.due:null,waiting:w,history:[{at:TODAY(),text:"Imported."}],created:TODAY()});});
  (o.questions||[]).slice(0,40).forEach(x=>{if(!x||!x.text)return;b.questions.push({id:uid("q_"),personId:pid(x.person||"Someone"),taskId:"",text:String(x.text),answer:String(x.answer||""),answeredAt:x.answer?TODAY():null,created:TODAY()});});
  return b;}

/* ---------- live transcription ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const REC={on:false,who:"me",rec:null,t0:0,local:false,err:"",
  can(){return !IS_ARTIFACT&&(IS_MAC||!!SR);},
  start(){const d=draft();this.err="";this.on=true;this.t0=Date.now()-CAP.elapsed*1000;CAP.editing=false;
    const lang=L()==="zh"?"zh-CN":"en-US";
    CAP.tick=setInterval(()=>{CAP.elapsed=Math.round((Date.now()-this.t0)/1000);const tm=$("#timer");if(tm)tm.textContent=fmtClock(CAP.elapsed);
      document.querySelectorAll("#wave span").forEach((s,j)=>{if(j>95)s.style.height=Math.round(6+Math.random()*24)+"px";});},1000);
    if(IS_MAC){native("speech.start",{lang}).catch(e=>{this.fail(e&&e.code==="denied"?t("rec_denied"):String(e&&e.message||e));});render();return;}
    const r=new SR();r.lang=lang;r.continuous=true;r.interimResults=true;this.rec=r;
    const go=()=>{try{r.start();}catch(e){}};
    if(SR.available&&"processLocally" in r){SR.available({langs:[lang],processLocally:true}).then(st=>{if(st==="available"){r.processLocally=true;this.local=true;}go();render();}).catch(()=>go());}else go();
    r.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)this.line(x[0].transcript);else interim+=x[0].transcript;}const el=$("#interim");if(el)el.textContent=interim;};
    r.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed")this.fail(t("rec_denied"));};
    r.onend=()=>{if(this.on)go();};
    render();
  },
  line(text){text=String(text||"").trim();if(!text)return;const d=draft();const p=person(d.personId);
    const sp=this.who==="me"?(L()==="zh"?"我":"You"):(p?p.name:t("rec_them"));
    d.transcript+=(d.transcript?"\n":"")+`[${fmtClock(CAP.elapsed)}] ${sp}: ${text.charAt(0).toUpperCase()+text.slice(1)}`;save();render();},
  onNative(ev){if(ev.type==="final")this.line(ev.text);else if(ev.type==="partial"){const el=$("#interim");if(el)el.textContent=ev.text;}else if(ev.type==="error")this.fail(ev.code==="denied"?t("rec_denied"):ev.message);},
  stop(){this.on=false;clearInterval(CAP.tick);if(IS_MAC)native("speech.stop").catch(()=>{});else if(this.rec)try{this.rec.stop();}catch(e){}save();render();},
  fail(msg){this.err=msg;this.stop();}
};

  if(el=g("[data-obaisave]")){if(!OB.tested){if(!OB.key&&OB.prov!=="custom"){OB.testErr=t("a_need");drawOB();return;}if(!(await testKey()))return;}saveAI();el.dataset.obaisave==="next"?openOB(nextStep()):closeOB();return;}
  if(g("[data-obaioff]")){P.ai=null;savePrefs();CLAUDE=null;OB.tested=false;OB.models=[];OB.key="";closeOB();render();return;}
  if(g("[data-obsignup]")){if(!check([["email","email"]]))return;P.email=$("#ob-email").value.trim();savePrefs();OB.busy=true;drawOB();await sendSignup();OB.busy=false;if(OB.screen==="signupOnly"){toast(t("signed"));openOB("settings");}else openOB(nextStep());return;}
  if(el=g("[data-obrole]")){OB.role=el.dataset.obrole;document.querySelectorAll(".ob-role").forEach(b=>b.classList.toggle("on",b===el));$("#oberr-role").hidden=true;return;}
  if(g("[data-obabout]")){if(!check([["name"],["role"]]))return;P.name=$("#ob-name").value.trim();const roleChanged=P.role!==OB.role;P.role=OB.role;ME=P.name;if(roleChanged&&S.sample&&S.pristine){S=sampleState();applySampleLang();}savePrefs();render();openOB(nextStep());return;}
  if(el=g("[data-obstart]")){OB.start=el.dataset.obstart;document.querySelectorAll(".ob-opt").forEach(b=>b.classList.toggle("on",b===el));return;}
  if(g("[data-obfinish]")){P.onboarded=true;savePrefs();if(OB.start==="sample"){/* never replace a board someone already filled in */const empty=!S.tasks.length&&!S.questions.length&&!S.people.length;if(!S.sample&&empty){S=sampleState();applySampleLang();save();}closeOB();go("today");}else openOB("setup");return;}
  if(el=g("[data-obteam]")){if(el.dataset.obteam==="__other"){OB.otherTeam=!OB.otherTeam;OB.pplName=($("#ob-ppl")||{}).value||OB.pplName;drawOB();}else{OB.pplName=($("#ob-ppl")||{}).value||"";addPerson2(el.dataset.obteam);}return;}
  if(g("[data-obaddother]")){addPerson2(($("#ob-otherteam")||{}).value.trim());return;}
  if(el=g("[data-obsetrole]")){P.role=el.dataset.obsetrole;savePrefs();if(S.sample&&S.pristine){S=sampleState();applySampleLang();}render();drawOB();return;}
  if(el=g("[data-obtheme]")){P.theme=el.dataset.obtheme;savePrefs();applyTheme();drawOB();return;}
  if(g("[data-obexport]")){exportData();return;}
  if(g("[data-oberase]")){OB.erase=true;drawOB();return;}
  if(g("[data-oberaseno]")){OB.erase=false;drawOB();return;}
  if(g("[data-oberaseyes]")){if(IS_ARTIFACT&&typeof dbRef!=="undefined"&&dbRef){try{await dbRef.delete();}catch(x){}}kvSet(LS_KEY,null);kvSet(PREF_KEY,null);kvSet("pm-tracker-theme",null);try{localStorage.clear();}catch(x){}location.reload();return;}
  if(g("[data-obtour]")){openOB("welcome");return;}
  if(el=g("[data-obrm]")){OB.people.splice(+el.dataset.obrm,1);drawOB();return;}
  if(g("[data-obsetup]")){createBoard();return;}
  if(g("[data-obimport]")){doImport();return;}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&OB.screen&&!["welcome","privacy","signup","about","ai","mac","done","setup"].includes(OB.screen))closeOB();});

/* ---------- start ---------- */
document.documentElement.lang=P.lang==="zh"?"zh-CN":"en";
applyTheme();applySampleLang();ME=P.name||"";
if(!IS_ARTIFACT&&P.signupPending&&P.email)sendSignup();
window.TRACKER={IS_ARTIFACT,P,OB,REC,PROVIDERS,listModels,pickModels,makeAdapter,parseJSONLoose,localize,zh,openOB,closeOB,IS_MAC};
boot();
if(!P.onboarded)openOB("welcome");
})();

</script>
