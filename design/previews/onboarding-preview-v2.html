<style>
:root{
  --bg:#f6f6f3;--surface:#fff;--surface-2:#f0efeb;--hover:#ecebe6;--border:#e5e3dd;--border-strong:#d3d0c8;
  --ink:#1c1b19;--ink-2:#67645e;--ink-3:#9c988f;--accent:#2f56c9;--accent-soft:#e7ecfb;
  --danger:#bd3f2e;--danger-soft:#fae9e5;--warn:#9f6612;--warn-soft:#f8eedb;--ok:#2a7a4e;--ok-soft:#e3f1e8;
  --violet:#6548b3;--violet-soft:#eee9f9;--clay:#b95d38;--clay-soft:#f7e9e2;--on-ink:#fff;--scrim:rgba(20,18,15,.34);
  --display:"Newsreader","Songti SC",Georgia,serif;--body:"Geist","PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131312;--surface:#1b1b1a;--surface-2:#242422;--hover:#2a2a27;--border:#2e2d2a;--border-strong:#3e3d39;--ink:#ecebe6;--ink-2:#a6a39b;--ink-3:#716e67;--accent:#88a5ff;--accent-soft:#1f2946;--danger:#f0836f;--danger-soft:#3a1f1a;--warn:#e2ab52;--warn-soft:#372a14;--ok:#68c690;--ok-soft:#173122;--violet:#b49df0;--violet-soft:#29223f;--clay:#e68d66;--clay-soft:#38241b;--on-ink:#131312;--scrim:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131312;--surface:#1b1b1a;--surface-2:#242422;--hover:#2a2a27;--border:#2e2d2a;--border-strong:#3e3d39;--ink:#ecebe6;--ink-2:#a6a39b;--ink-3:#716e67;--accent:#88a5ff;--accent-soft:#1f2946;--danger:#f0836f;--danger-soft:#3a1f1a;--warn:#e2ab52;--warn-soft:#372a14;--ok:#68c690;--ok-soft:#173122;--violet:#b49df0;--violet-soft:#29223f;--clay:#e68d66;--clay-soft:#38241b;--on-ink:#131312;--scrim:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{text-wrap:balance;margin:0}p,li,.d{text-wrap:pretty}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.picker{position:sticky;top:0;z-index:30;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--ink-2);padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ghost{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:8px;padding:5px 10px;font-size:12.5px}
.stage{display:flex;justify-content:center;padding:22px 16px 14px}
.frame{position:relative;width:100%;max-width:1100px;min-height:1120px;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;flex:none}
.mark{width:20px;height:20px;border-radius:6px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-size:11px;font-weight:600}
.nav{display:flex;gap:2px;min-width:0;overflow:hidden}.nav span{padding:5px 10px;border-radius:7px;color:var(--ink-2);font-size:13px;font-weight:500;white-space:nowrap}.nav span.on{background:var(--surface-2);color:var(--ink)}
.grow{flex:1}
.tb{display:flex;gap:6px;flex:none}
.topbtn{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:8px;padding:5px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.topbtn:hover{border-color:var(--border-strong);color:var(--ink)}
.topbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.topbtn.icon{width:30px;justify-content:center;padding:5px 0;font-size:14px}
.board{padding:28px 32px}
.date{font-size:12.5px;color:var(--ink-3);margin-bottom:8px}
.hello{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.18}
.hello .l2{color:var(--ink-2)}
.item{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-top:8px;max-width:640px}
.circ{width:18px;height:18px;border:1.5px solid var(--border-strong);border-radius:50%;flex:none}
.item .t{font-weight:500}.item .s{font-size:12.5px;color:var(--ink-2)}
.blabel{font-size:11.5px;font-weight:500;color:var(--ink-3);letter-spacing:.03em;margin:26px 0 4px}
.empty-board{border:1px dashed var(--border-strong);border-radius:12px;padding:22px;max-width:640px;color:var(--ink-3);margin-top:10px}

.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:56px 20px 20px}
.card{width:min(540px,100%);background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 60px rgba(20,18,15,.22);padding:24px 24px 20px}
.card.wide{width:min(580px,100%)}
.steps{display:flex;gap:5px;margin-bottom:18px}
.steps i{height:4px;flex:1;border-radius:2px;background:var(--surface-2)}
.steps i.on{background:var(--ink)}
.chead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.eyebrow{font-size:11.5px;font-weight:500;color:var(--ink-3);letter-spacing:.03em}
.x{margin-left:auto;border:0;background:none;color:var(--ink-3);font-size:18px;line-height:1;padding:2px 4px}
.x:hover{color:var(--ink)}
.card h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.22;letter-spacing:-.01em;margin:4px 0 8px}
.card p{margin:0 0 12px;color:var(--ink-2);font-size:13.5px}
.acts{display:flex;align-items:center;gap:8px;margin-top:18px}
.btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:9px;padding:7px 14px;font-size:13px;font-weight:500;white-space:nowrap}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:12px}
.skip{border:0;background:none;color:var(--ink-3);font-size:13px;padding:0}
.skip:hover{color:var(--ink)}
.inp,.sel{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:9px 11px;font-size:14px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.flabel{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin:12px 0 5px}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px}
.langs{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;margin-left:auto}
.langs button{border:0;background:none;border-radius:7px;padding:3px 10px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.langs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.even{display:grid!important;justify-content:start}
.even>*{justify-self:stretch;text-align:center}
.err{font-size:12px;color:var(--danger);margin-top:5px}
.inp.bad{border-color:var(--danger)}
.req{color:var(--danger);margin-left:2px}
.pill{font-size:12px;border:1px solid var(--border);border-radius:999px;padding:3px 10px;color:var(--ink-2);background:var(--surface)}
.oss{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink-2)}
.oss b{color:var(--ink);font-weight:500}
.flow{display:grid;gap:8px;margin:6px 0 4px}
.fl{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:11px;padding:10px 12px}
.fl .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.fl .h{font-size:13px;font-weight:500}
.fl .d{font-size:12.5px;color:var(--ink-2)}
.lnk{border:0;background:none;padding:0;color:var(--accent);font-size:13px;font-weight:500}
.tabs{display:flex;gap:2px;background:var(--surface-2);border-radius:9px;padding:3px;margin:4px 0 10px}
.tabs button{flex:1;border:0;background:none;border-radius:7px;padding:5px 6px;font-size:12px;font-weight:500;color:var(--ink-2)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.demo{border:1px solid var(--border);border-radius:11px;padding:12px;background:var(--bg);min-height:138px}
.demo .ln{font-size:12.5px;padding:3px 0}
.demo .sp{font-weight:600;font-size:11.5px;margin-right:4px}
.demo mark{background:var(--ok-soft);color:inherit;border-radius:3px;padding:0 2px}
.demo .row{display:flex;gap:8px;align-items:center;font-size:12.5px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;margin-bottom:5px;background:var(--surface)}
.demo .row .ic{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:600;flex:none}
.demo .bub{font-size:12.5px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 9px;margin-bottom:6px}
.demo .cap{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--danger);font-weight:500;margin-bottom:6px}
.live i{width:6px;height:6px;border-radius:50%;background:var(--danger)}
.provs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:4px 0 10px}
.prov{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:7px 8px;font-size:12.5px;font-weight:500;text-align:left}
.prov small{display:block;font-weight:400;color:var(--ink-3);font-size:11px}
.prov.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
details{border:1px solid var(--border);border-radius:10px;margin-top:10px}
summary{cursor:pointer;padding:9px 12px;font-size:13px;font-weight:500;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;color:var(--ink-3);font-size:15px}
details[open] summary::after{content:"–"}
details ol{margin:0;padding:0 14px 12px 32px;font-size:12.5px;color:var(--ink-2)}
details ol li{margin:4px 0}
code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.keyrow{display:flex;gap:8px;margin-top:10px}
.keyrow .inp{font-family:var(--mono);font-size:12.5px}
.ok{font-size:12px;color:var(--ok);margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.perks{display:grid;gap:8px;margin:8px 0 6px}
.perk{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.perk .ic{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;flex:none;font-size:13px}
.perk .h{font-weight:500}
.perk .d{font-size:12.5px;color:var(--ink-2)}
.dl{display:flex;gap:12px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:12px}
.appicon{width:44px;height:44px;border-radius:11px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:600;font-size:20px;flex:none}
.set{border-top:1px solid var(--border);padding:14px 0}
.set:first-of-type{border-top:0;padding-top:4px}
.set h3{font-size:13px;font-weight:600;margin-bottom:8px}
.setrow{display:flex;align-items:center;gap:10px;font-size:13px;padding:4px 0;flex-wrap:wrap}
.setrow .l{flex:1;min-width:0;color:var(--ink-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;border:1px solid var(--border);border-radius:999px;padding:3px 6px 3px 10px;background:var(--surface-2)}
.chip button{border:0;background:none;color:var(--ink-3);padding:0 2px}
.note{max-width:1100px;margin:0 auto 40px;padding:0 16px;text-align:center;color:var(--ink-3);font-size:12.5px}
@media (max-width:760px){.dl{flex-wrap:wrap}.dl .grow{display:none}.dl .btn{width:100%}.nav{display:none}.board{padding:22px 18px}.hello{font-size:26px}.provs{grid-template-columns:repeat(2,minmax(0,1fr))}.scrim{padding:20px 12px}}
.drop{border:1.5px dashed var(--border-strong);border-radius:12px;padding:22px;text-align:center;display:grid;gap:8px;justify-items:center;margin:6px 0 4px;background:var(--bg)}
.drop .big{font-size:22px;color:var(--ink-3)}
.scan{border:1px solid var(--ok);background:var(--ok-soft);border-radius:12px;padding:12px 14px;margin:6px 0 4px}
.scan .f{font-size:12.5px;color:var(--ink-2);font-family:var(--mono)}
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.cnt{background:var(--surface);border-radius:9px;padding:8px 10px}
.cnt .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.cnt .l{font-size:11.5px;color:var(--ink-2)}
.kinds{display:grid;gap:6px;margin-top:10px}
.kind{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--ink-2)}
.kind b{color:var(--ink);font-weight:500}
.imp{margin-top:10px;font-size:13px}
</style>
</head>

function show(){const t=T[L];document.documentElement.lang=L==="zh"?"zh-CN":"en";
  document.getElementById("nav").innerHTML=t.nav.map((x,i)=>`<span class="${i===0?"on":""}">${x}</span>`).join("");
  document.getElementById("aiLbl").textContent=t.ai;document.getElementById("dlBtn").textContent=t.dl;
  document.getElementById("board").innerHTML=board();
  document.getElementById("scrim").hidden=screen==="closed";
  if(screen!=="closed")document.getElementById("card").innerHTML=card();
  document.getElementById("note").textContent=t.note;
  document.querySelectorAll("#screens button").forEach(b=>b.classList.toggle("on",b.dataset.v===screen));
  document.querySelectorAll("#langPick button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
  const pi=document.getElementById("pplIn");if(pi)pi.onkeydown=e=>{if(e.key==="Enter"&&pi.value.trim()){people.push(pi.value.trim());show();const ep=document.getElementById("err-ppl");if(ep)ep.hidden=true;document.getElementById("pplIn").focus();}};
  glue();evenRows();
}
function evenRows(){document.querySelectorAll("#card .pills,#card .chips,#card .setrow,#card .tabs,#card .provs").forEach(el=>{el.classList.remove("even");el.style.gridTemplateColumns="";
  const kids=[...el.children].filter(k=>k.offsetParent!==null);if(kids.length<2)return;
  const rows=lines(kids);if(rows.length<2)return;
  if(rows[rows.length-1].length===1){const cols=Math.ceil(kids.length/rows.length);el.classList.add("even");el.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;}});}
function lines(kids){const rows=[];let bottom=-1e9;kids.map(k=>[k,k.getBoundingClientRect()]).sort((x,y)=>x[1].top-y[1].top).forEach(([k,r])=>{if(r.top>=bottom-1){rows.push([k]);bottom=r.bottom;}else{rows[rows.length-1].push(k);bottom=Math.max(bottom,r.bottom);}});return rows;}
window.addEventListener("resize",evenRows);
function glue(){document.querySelectorAll("#card h2,#card p,#card .d,#board .t,#board .s").forEach(el=>{const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let last=null,n;while(n=w.nextNode())if(n.nodeValue.trim())last=n;if(last&&L==="en")last.nodeValue=last.nodeValue.replace(/([^\s])[ ]+(\S+\s*)$/,"$1 $2");});}
document.addEventListener("input",e=>{const f=e.target.dataset&&e.target.dataset.f;if(f){VALS[f]=e.target.value;e.target.classList.remove("bad");const er=document.getElementById("err-"+f);if(er)er.hidden=true;}});
document.addEventListener("click",e=>{
  const s=e.target.closest("#screens button");if(s){screen=s.dataset.v;show();return;}
  const l=e.target.closest("[data-l]");if(l){L=l.dataset.l;show();return;}
  const g=e.target.closest("[data-go]");if(g){if(g.dataset.req&&!validate(g.dataset.req))return;screen=g.dataset.go;show();return;}
  const o=e.target.closest("[data-open]");if(o){screen=o.dataset.open;show();return;}
  const cl=e.target.closest("[data-close]");if(cl){if(cl.dataset.req&&!validate(cl.dataset.req))return;screen="closed";show();return;}
  const tb=e.target.closest("[data-t]");if(tb){tab=+tb.dataset.t;show();return;}
  const p=e.target.closest(".prov");if(p){prov=+p.dataset.p;show();return;}
  const rm=e.target.closest("[data-rm]");if(rm){people.splice(+rm.dataset.rm,1);show();return;}
});
const root=document.documentElement,th=document.getElementById("theme");
const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
const sync=()=>th.textContent=isDark()?"Light":"Dark";
th.onclick=()=>{root.dataset.theme=isDark()?"light":"dark";sync();};sync();show();
</script>
</body>
</html>
